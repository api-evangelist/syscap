aid: syscap
name: Syscap
description: Syscap is a Monterrey-based Mexican financial technology company that provides a private-credit
  and funding-management platform for non-bank financial intermediaries (SOFOMs and financieras). Its
  software helps loan originators manage funding lines, organize documentation, automate tax compliance,
  generate amortization tables and electronic signatures, and give funders a 24/7 transparency portal
  with balance reports and transaction tracking. More than 140 financial institutions across Mexico use
  Syscap to manage private debt. The company operates a web application and a mobile app; it does not
  publish a public API, developer portal, or API documentation.
